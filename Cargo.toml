[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Autonomous software development agent that drives web-based AI chat via CDP"
license = "MIT"
repository = "https://github.com/lisering/forge"
documentation = "https://docs.rs/forge"
keywords = ["ai", "agent", "cdp", "automation", "development"]
categories = ["command-line-utilities", "development-tools"]
authors = ["john"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
zip = "2"
walkdir = "2"
sha2 = "0.10"
async-trait = "0.1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
proptest = "1"
mockall = "0.12"

# ── docs.rs 官方文档配置 ──────────────────────────────────
# https://docs.rs/about/metadata
[package.metadata.docs.rs]
# 编译所有 features，确保文档包含所有 API
all-features = true
# 编译时设置环境变量，用于 cfg(condition) 文档
rustdoc-args = ["--cfg", "docsrs"]
# 目标平台
targets = ["x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# ── cargo 编译优化 ────────────────────────────────────────
[profile.release]
# LTO (Link Time Optimization) — 减小二进制体积，提升性能
lto = true
# 只保留必要的调试信息
debug = false
# 优化等级
opt-level = 3
# 单代码单元 (更好的优化)
codegen-units = 1
# 裁剪符号表
strip = true

[profile.dev]
# 开发模式快速编译
opt-level = 0
debug = true
incremental = true
