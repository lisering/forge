[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Autonomous software development agent that drives web-based AI chat via CDP"
license = "MIT"
repository = "https://github.com/lisering/forge"
documentation = "https://docs.rs/forge"
keywords = ["ai", "agent", "cdp", "automation", "development"]
categories = ["command-line-utilities", "development-tools"]
authors = ["john"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
zip = "2"
walkdir = "2"
sha2 = "0.10"
async-trait = "0.1"
tempfile = "3"
toml = "0.8"

# 火焰图分析 (optional feature)
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"], optional = true }

# Unix 进程组管理 (Chrome 进程树 kill)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
proptest = "1"
mockall = "0.12"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
# 启用 pprof 火焰图分析: cargo run --features pprof -- run ... --profile
pprof = ["dep:pprof"]

